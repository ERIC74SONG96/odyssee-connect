<html lang="fr">

<meta property="og:type" content="website">

<meta property="og:description" content="Une course de 10 km au profit des veuves, des enfants et des familles frappés par la destruction de l'environnement. Organisée par L'Odyssée de l'environnement au Cameroun.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: an event poster — loud, proud, sunny, but tidy like an official race site.
   IDEA: the race bib — the hero is a giant dossard pinned over Yaoundé's seven hills.
   PICTURE: layered green hills, the 10 km route as a red ribbon with yellow km flags, the bib in front.
   COLOUR and TYPE: Cameroon green dominant, sun yellow support, red accent; Barlow Condensed for numbers and titles, Barlow for text.
   LAYOUT: full-bleed bands — green hero, white sections, yellow call to action, deep green footer. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0b1d13);--ink:light-dark(#13261a,#eef5ef);--muted:light-dark(#4d6455,#a9c0b0);
  --green:#14713b;--green-d:#0c4a26;--yellow:#f7c51e;--red:#d62f2f;
  --soft:light-dark(#eef6f0,#12291b);--line:light-dark(#d6e6da,#21402c);--card:light-dark(#ffffff,#102619)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Barlow,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(32px,4.5vw,48px);font-weight:800}
h3{font-size:22px;font-weight:600}
p{margin:0 0 12px;max-width:68ch}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(40px,6vw,88px) max(5vw,16px)}
.lead{font-size:18px;color:var(--muted);margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:16px;font-family:inherit}
.btn.y{background:var(--yellow);color:#13261a}
.btn.o{border-color:currentColor;background:transparent;color:inherit}
.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* nav */
header.top{position:sticky;top:0;z-index:20;background:var(--green-d);color:#fff}
.nav{display:flex;align-items:center;gap:18px;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1}
.logo small{display:block;font:500 12px Barlow,sans-serif;opacity:.8}
.links{display:flex;gap:4px 16px;flex-wrap:wrap;margin-left:auto;font-size:14.5px}
@media(min-width:861px){.nav{flex-wrap:nowrap}.links{flex-wrap:nowrap}.links a{white-space:nowrap}}
.links a{text-decoration:none;opacity:.9;padding:6px 0}
.links a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.nav .btn{min-height:42px}
@media(max-width:860px){.links{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.links a{flex:none}.nav .btn{margin-left:auto}}

/* hero */
.hero{position:relative;background:var(--green);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;padding:clamp(36px,5vw,72px) max(5vw,16px) 0;position:relative;z-index:2}
.hero h1{font-size:clamp(52px,8vw,104px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--yellow)}
.hero .tag{font-size:clamp(18px,2vw,22px);margin:16px 0 8px;color:#e6f3ea}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 26px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.scene{position:relative;height:clamp(300px,38vw,470px)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.bib{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-4deg);width:min(78%,380px);background:#fff;color:#13261a;border-radius:14px;padding:18px 22px 16px;box-shadow:0 22px 40px rgba(0,0,0,.28);text-align:center}
.bib::before,.bib::after{content:"";position:absolute;top:12px;width:12px;height:12px;border-radius:50%;background:#c9d3cc;box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
.bib::before{left:12px}.bib::after{right:12px}
.bib .t{font:800 18px "Barlow Condensed",sans-serif;color:var(--green);display:flex;justify-content:center;gap:8px}
.bib .n{font:800 clamp(72px,9vw,112px)/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:4px 0}
.bib .b{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.bib .b i{flex:1}
.hills{position:relative;z-index:1;height:70px;margin-top:-1px}
.hills svg{display:block;width:100%;height:100%}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.scene{order:2}}

/* figures */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:-34px;position:relative;z-index:3}
.figs div{background:var(--card);padding:20px 22px}
.figs b{display:block;font:800 clamp(34px,4vw,46px)/1 "Barlow Condensed",sans-serif;color:var(--green)}
:root[data-theme=dark] .figs b{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .figs b{color:var(--yellow)}}
.figs span{color:var(--muted);font-size:15px}
@media(max-width:700px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* grids & cards */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card p{color:var(--muted);margin:6px 0 0;font-size:15.5px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);margin-bottom:12px}
.ico svg{width:24px;height:24px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme=dark] .ico svg{stroke:var(--yellow)}
.pillars{display:grid;gap:14px;margin-top:24px}
.pillar{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:14px;background:var(--soft)}
.pillar b{font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--red);width:28px;flex:none}
.pillar h3{font-size:20px}.pillar p{margin:4px 0 0;color:var(--muted)}
.soft{background:var(--soft)}

/* tables */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--green-d);color:#fff;font-weight:600;font-size:15px}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
.price{font:800 24px "Barlow Condensed",sans-serif;color:var(--green);white-space:nowrap}
.free{color:var(--red)}
.note{margin-top:14px;padding:12px 16px;border-left:4px solid var(--yellow);background:var(--soft);border-radius:0 10px 10px 0;font-size:15px;color:var(--muted)}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 16px;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;font-weight:600;color:var(--muted)}.stack td:empty{display:none}}

/* route */
.route{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.route svg{width:100%;height:auto;display:block}
.tr-tabs{display:flex;gap:8px;margin:0 0 10px}.tr-tabs button{flex:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:800 16px Barlow,sans-serif;cursor:pointer;color:#13261a}
.tr-tabs button[aria-pressed="true"]{color:#fff;border-color:transparent}.tr-tabs .t3[aria-pressed="true"]{background:#14713b}.tr-tabs .t5[aria-pressed="true"]{background:#e0a800;color:#13261a}.tr-tabs .t10[aria-pressed="true"]{background:#c62828}
.tr-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 2px 0}.tr-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tr-info{font-size:13px;color:#4a5a4f;margin:8px 2px 0}
.tr-etapes{list-style:none;margin:10px 0 0;padding:0 0 0 6px}.tr-etapes li{display:flex;gap:12px;padding:6px 0 6px 14px;border-left:3px solid #f7c51e;position:relative;font-size:14px}
.tr-etapes li::before{content:"";position:absolute;left:-8px;top:10px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #0b4d2c}
.tr-etapes li.dep::before{background:#0b4d2c}.tr-etapes li.arr::before{background:#c62828;border-color:#c62828}
.tr-etapes .km{flex:none;width:62px;font-weight:800;color:#0b4d2c;font-variant-numeric:tabular-nums}.tr-etapes small{display:block;color:#5b6b5f}
.tr-dl{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:700;color:#0b4d2c;text-decoration:underline}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);padding:6px 8px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* app */
.app img{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 18px 40px rgba(0,0,0,.18)}
ul.list{padding:0;margin:16px 0 0;list-style:none}
ul.list li{padding:9px 0 9px 30px;border-bottom:1px solid var(--line);position:relative}
ul.list li::before{content:"";position:absolute;left:4px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--soft)}

/* partners */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}
.lvl{border-radius:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c)}
.lvl b{display:block;font:800 26px "Barlow Condensed",sans-serif;white-space:nowrap}
.lvl span{font-size:14px;color:var(--muted)}
@media(max-width:820px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sun{background:var(--yellow);color:#13261a}
.sun .lead{color:#3d3a1c}
.sun .btn.g{background:var(--green-d);color:#fff}

footer{background:var(--green-d);color:#d8eadf;font-size:15px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
footer h3{color:#fff;font-size:20px;margin-bottom:8px}
footer a{display:block;text-decoration:none;padding:3px 0;opacity:.9}
footer a:hover{text-decoration:underline}
footer .fine{border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:16px;font-size:13.5px;opacity:.8}
@media(max-width:760px){footer .cols{grid-template-columns:1fr}}

/* ---- pages (hash routing) ---- */
.view{display:none}.view.on{display:block}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.hero-photo{padding:0;background:var(--green-d)}.hero-photo picture,.hero-photo .hero-img{display:block;width:100%}.hero-photo .hero-img{height:auto;max-height:78vh;object-fit:cover;object-position:center}.hero-band{background:var(--green-d);color:#fff;padding:18px max(5vw,16px) 46px}.hero-band .hb{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}.hero-band .tag{margin:0;font-size:clamp(17px,1.8vw,21px);max-width:60ch;color:#e6f3ea}.hero-band .cta{margin:0}.cd{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.16)}.cdd{margin:0;font:800 clamp(20px,2.4vw,28px) "Barlow Condensed",sans-serif;color:var(--yellow);letter-spacing:.01em}.cdr{display:flex;gap:10px}.cdb{min-width:72px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;text-align:center}.cdb b{display:block;font:800 clamp(26px,3vw,36px)/1 "Barlow Condensed",sans-serif;color:#fff}.cdb span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#cfe3d5}@media(max-width:520px){.cdb{min-width:0;flex:1}.cdr{width:100%}}.gauge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px 18px;margin-top:18px}.gauge .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.gauge .gnum{font:800 30px "Barlow Condensed",sans-serif;color:var(--yellow)}.gauge .gof{font-size:14px;opacity:.9}.gauge .bar{height:14px;border-radius:7px;background:rgba(255,255,255,.18);overflow:hidden;margin:10px 0 6px}.gauge .bar i{display:block;height:100%;background:var(--yellow);border-radius:7px;width:0;transition:width .8s}.gauge .gnote{font-size:13.5px;opacity:.85;margin:0}.gauge.light{background:var(--card);border-color:var(--line);color:var(--ink)}.gauge.light .gnum{color:var(--green)}.gauge.light .bar{background:var(--soft)}.gauge.light .bar i{background:var(--green)}tr.race td{background:var(--yellow)!important;color:#13261a;font-weight:600}.plan th:first-child,.plan td:first-child{width:70px}.social .slinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.social .slinks a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid currentColor;text-decoration:none;font-weight:600}.legal h2{font-size:28px;margin-top:28px}.legal h3{margin-top:18px}.legal p,.legal li{color:var(--muted);max-width:75ch}.todo{background:#fde3c4;color:#8a4a0c;padding:0 6px;border-radius:4px;font-style:italic}
.hero .scene{align-self:end;height:clamp(320px,40vw,520px);margin-bottom:-2px}
.hero .scene svg{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 96%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 96%,transparent 100%)}
@media(max-width:760px){.hero .scene svg{-webkit-mask-image:none;mask-image:none}}

.pagehead{background:var(--green);color:#fff;padding:clamp(36px,5vw,64px) max(5vw,16px) clamp(28px,4vw,48px)}
.pagehead h1{font-size:clamp(40px,6vw,64px);font-weight:800}
.pagehead p{color:#e6f3ea;font-size:18px;margin-top:12px;max-width:62ch}
.crumb{font-size:14px;opacity:.85;margin-bottom:10px}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.links a[aria-current=page]{opacity:1;text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--yellow);text-decoration-thickness:3px}
.burger{display:none;margin-left:auto;background:transparent;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;min-height:44px;padding:0 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
@media(max-width:1180px){
  .nav{flex-wrap:wrap}
  .burger{display:inline-flex;align-items:center}
  .nav .btn{display:none}
  .links{display:none;order:3;width:100%;flex-direction:column;gap:0;overflow:visible;padding:6px 0 10px}
  .links.open{display:flex}
  .links a{padding:12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:17px}
}
.teasers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
@media(max-width:820px){.teasers{grid-template-columns:1fr}}
.teaser{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:transform .15s}
.teaser:hover{transform:translateY(-2px)}
.teaser .k{font:800 15px "Barlow Condensed",sans-serif;color:var(--red)}
.teaser h3{margin:6px 0 8px;font-size:26px}
.teaser p{color:var(--muted);margin:0}
.teaser .go{display:inline-block;margin-top:12px;font-weight:600;color:var(--green)}
.cause{background:var(--green-d);color:#fff;border-radius:22px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.cause h2{color:#fff}.cause p{color:#d8eadf}
.cause .big{font:800 clamp(54px,8vw,92px)/1 "Barlow Condensed",sans-serif;color:var(--yellow)}
.cause .big small{display:block;font:500 16px Barlow,sans-serif;color:#d8eadf;margin-top:6px}
@media(max-width:760px){.cause{grid-template-columns:1fr}}
.steps{counter-reset:s;display:grid;gap:12px;margin-top:20px;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--yellow);color:#13261a;display:grid;place-items:center;font:800 22px "Barlow Condensed",sans-serif}
.steps b{display:block;font-size:17px}
.steps span{color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{cursor:pointer;padding:16px 18px;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:800 24px/1 "Barlow Condensed",sans-serif;color:var(--green)}
details[open] summary::after{content:"–"}
details>div{padding:0 18px 16px;color:var(--muted)}
.faqcat{font:800 22px "Barlow Condensed",sans-serif;margin:28px 0 12px}
.contactgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
@media(max-width:820px){.contactgrid{grid-template-columns:1fr}}
.copy{margin-top:10px;min-height:44px;border-radius:999px;border:2px solid var(--green);background:transparent;color:var(--ink);padding:0 18px;font:600 15px Barlow,sans-serif;cursor:pointer}
.mail{font-weight:600;word-break:break-all}
.prov{display:inline-block;font-size:13px;background:var(--yellow);color:#13261a;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle;font-weight:600}

/* ---- design v2 ---- */
.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow2{display:inline-block;font:700 14px Barlow,sans-serif;color:var(--red);margin-bottom:8px}
.dist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px}
@media(max-width:860px){.dist{grid-template-columns:1fr}}
.dcard{position:relative;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(12,74,38,.08)}
.dcard .top{padding:22px 22px 18px;color:#fff;background:var(--c);position:relative}
.dcard .top::after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.dcard .km{font:800 64px/0.9 "Barlow Condensed",sans-serif;letter-spacing:-.01em}
.dcard .km small{font-size:28px;margin-left:4px}
.dcard .nm{font:600 18px Barlow,sans-serif;margin-top:6px;opacity:.95}
.dcard.y .top{color:#13261a}
.dcard .body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.dcard .body p{margin:0;color:var(--muted)}
.dcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.dcard .meta span{font-size:13.5px;font-weight:600;background:var(--soft);border-radius:999px;padding:4px 10px}
.dcard .price{font:800 26px "Barlow Condensed",sans-serif;color:var(--ink);margin-top:auto}
.dcard .price small{font:500 14px Barlow,sans-serif;color:var(--muted)}
.appband{background:linear-gradient(135deg,#0c4a26 0%,#14713b 60%,#1e8a4a 100%);color:#fff;border-radius:28px;padding:clamp(26px,4vw,52px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;overflow:hidden;position:relative}
.appband::before{content:"";position:absolute;left:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(247,197,30,.15)}
.appband h2{color:#fff}.appband p{color:#d8eadf}
.appband .feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:18px 0 22px;padding:0;list-style:none}
.appband .feat li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.appband .feat li::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;background:var(--yellow);box-shadow:inset 0 0 0 5px #0c4a26;margin-top:2px}
.appband img{width:100%;max-width:360px;justify-self:center;border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(3deg)}.appband img.wide{max-width:none;transform:none;border-radius:20px}.appband .sig{font:italic 600 19px Barlow,sans-serif;color:var(--yellow);margin:6px 0 4px}.shot1{margin:24px 0 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.shot1 img{display:block;width:100%;height:auto}.shot1 figcaption{padding:12px 16px;font-size:14px;color:var(--muted)}
@media(max-width:820px){.appband{grid-template-columns:1fr}.appband .feat{grid-template-columns:1fr}.appband img{max-width:280px}}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 14px;font-size:14px;margin:0 8px 8px 0}
.featgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
@media(max-width:860px){.featgrid{grid-template-columns:1fr}}
.feature{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.feature .tagv{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:10px;background:var(--green);color:#fff}
.feature .tagv.soon{background:var(--yellow);color:#13261a}
.feature p{color:var(--muted);margin:6px 0 0}
.shots{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:26px;align-items:start}
.shots figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.shots img{display:block;width:100%;height:auto}
.shots figcaption{padding:12px 16px;font-size:14px;color:var(--muted)}
@media(max-width:820px){.shots{grid-template-columns:1fr}}
.teasers .teaser{box-shadow:0 8px 24px rgba(12,74,38,.06)}
.band h2{letter-spacing:-.005em}
.nav .links a.shoplink{color:var(--yellow);font-weight:700}
.shopband{display:flex;align-items:center;justify-content:space-between;gap:20px 32px;flex-wrap:wrap;border:2px solid var(--yellow);border-radius:24px;padding:clamp(22px,3.5vw,40px);background:linear-gradient(120deg,rgba(247,197,30,.14),transparent 60%)}
.shopband .lead{margin-bottom:0;max-width:60ch}
.logo span{white-space:nowrap}.links{gap:4px 14px}.lang{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:8px;min-height:34px;min-width:44px;font:700 13px Barlow,sans-serif;cursor:pointer;margin-left:6px}.lang:hover{background:rgba(255,255,255,.12)}@media(max-width:1180px){.lang{align-self:flex-start;margin:10px 0 0}}</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<template id="tpl-fr">
<header class="top">
  <nav class="nav" aria-label="Navigation principale">

    <button class="burger" id="burger" aria-expanded="false" aria-controls="menu">Menu</button>

    <a class="btn y" href="#inscriptions">S'inscrire</a>
  </nav>
</header>

<main>
<!-- ============ ACCUEIL ============ -->
<div class="view" id="accueil">
<section class="hero hero-photo" id="top-accueil">
  <h1 class="sr">10 KM de Yaoundé 2027</h1>
  <picture>
    <source media="(max-width:700px)" srcset="hero-20km-mobile.jpg">
    <img class="hero-img" src="hero-20km.jpg" alt="Coureurs du 10 KM de Yaoundé 2027 aux couleurs de L'Odyssée de l'environnement, avec le drapeau du Cameroun">
  </picture>
  <div class="hero-band">
    <div class="wrap hb">
      <div class="cd" role="timer" data-cd="2027-07-10T08:00:00+01:00"><p class="cdd">Samedi 10 juillet 2027 · départ à 8&nbsp;h · date provisoire</p><div class="cdr"><div class="cdb"><b data-u="j">–</b><span>Jours</span></div><div class="cdb"><b data-u="h">–</b><span>Heures</span></div><div class="cdb"><b data-u="m">–</b><span>Min</span></div><div class="cdb"><b data-u="s">–</b><span>Sec</span></div></div></div>
      <p class="tag">Nous courons pour les veuves, les enfants et les familles frappés par la destruction de l'environnement.</p>
      <div class="cta"><a class="btn y" href="#inscriptions">Courir pour eux</a><a class="btn o" href="#cause">Le Fonds de solidarité</a></div>
    </div>
  </div>
</section>
<div class="wrap" style="padding:0 max(5vw,16px)">
  <div class="figs">
    <div><b>10 km</b><span>du boulevard du 20 Mai au Musée national</span></div>
    <div><b>10 000</b><span>participants visés, par paliers</span></div>
    <div><b>5 M</b><span>FCFA : objectif du Fonds de solidarité</span></div>
    <div><b>7,5 M</b><span>FCFA pour l'environnement</span></div>
  </div>
</div>
<section class="band">
  <div class="wrap">
    <div class="sechead"><div><span class="eyebrow2">Choisissez votre course</span><h2>Trois distances, un seul élan</h2></div><a class="btn o" style="color:var(--green)" href="#course">Voir le détail des courses →</a></div>
    <div class="dist"><article class="dcard " style="--c:#14713b"><div class="top"><div class="km">3<small>km</small></div><div class="nm">Marche écologique et familiale</div></div><div class="body"><p>Accessible au plus grand nombre : enfants, familles, aînés. On marche à son rythme.</p><div class="meta"><span>Ouverte à tous</span><span>Médaille pour chacun</span></div><div class="price">500 FCFA <small>pour tous</small></div></div></article><article class="dcard y" style="--c:#f7c51e"><div class="top"><div class="km">5<small>km</small></div><div class="nm">Course populaire</div></div><div class="body"><p>Adaptée aux débutants et aux étudiants, pour une première course en ville.</p><div class="meta"><span>Ouverte à tous</span><span>Médaille pour chacun</span></div><div class="price">500 FCFA <small>pour tous</small></div></div></article><article class="dcard " style="--c:#d62f2f"><div class="top"><div class="km">10<small>km</small></div><div class="nm">Défi sportif</div></div><div class="body"><p>Pour les coureurs plus entraînés, du boulevard du 20 Mai au Musée national.</p><div class="meta"><span>Chronométrée</span><span>2,5 M FCFA de prix</span></div><div class="price">500 / 1 000 FCFA <small>étudiants / travailleurs</small></div></div></article></div>
  </div>
</section>
<section class="band">
  <div class="wrap">
    <div class="cause">
      <div>
        <h2>Pourquoi nous courons</h2>
        <p class="lead" style="color:#d8eadf">Le 10 KM de Yaoundé est organisé pour venir en aide aux veuves, aux enfants et aux familles frappés par la destruction de l'environnement : inondations, glissements de terrain, pollution.</p>
        <div class="cta" style="margin:18px 0 0"><a class="btn y" href="#cause">Découvrir le Fonds de solidarité</a></div>
        <div class="gauge"><div class="gtop"><span class="gnum">0 FCFA</span><span class="gof"></span></div><div class="bar"><i></i></div><p class="gnote"></p></div>
      </div>
      <div class="big">5 000 000<small>FCFA : objectif du Fonds de solidarité environnementale pour la première édition</small></div>
    </div>
    <div class="teasers">
      <a class="teaser" href="#course"><span class="k">3 km · 5 km · 10 km · zéro déchet</span><h3>La course</h3><p>Trois distances, le programme environnemental et le parcours à travers la ville aux sept collines.</p><span class="go">En savoir plus →</span></a>
      <a class="teaser" href="#inscriptions"><span class="k">À partir de 500 FCFA</span><h3>Inscriptions</h3><p>Tarifs, prix et récompenses, et l'application officielle pour s'inscrire et payer par mobile money.</p><span class="go">Voir les tarifs →</span></a>
      <a class="teaser" href="#benevoles"><span class="k">Rejoignez l'équipe</span><h3>Bénévoles</h3><p>Accueil, ravitaillement, collecte des déchets : donnez de votre temps pour la cause.</p><span class="go">Devenir bénévole →</span></a>
    </div>
  </div>
</section>
<section class="band">
  <div class="wrap">
    <div class="appband">
      <div>
        <span class="eyebrow2" style="color:var(--yellow)">L'application du réseau Odyssée</span>
        <h2>Odyssée Connect</h2>
        <p class="sig">Ensemble, agissons pour un avenir durable.</p>
        <p class="lead">Le 10 KM de Yaoundé est le premier événement hébergé dans Odyssée Connect, l'application qui rassemble citoyens, associations, entreprises et partenaires du réseau Odyssée.</p>
        <ul class="feat"><li>Inscription au 10 KM en quelques minutes</li><li>Paiement Orange Money et MTN MoMo</li><li>Dossard numérique et QR code</li><li>Parcours, infos et notifications</li><li>Résultats et classements</li><li>Bientôt : actions environnementales et bénévolat</li></ul>
        <a class="btn y" href="#application">Découvrir Odyssée Connect</a>
      </div>
      <img class="wide" src="connect-presentation.jpg" alt="Odyssée Connect : écran d'accueil et page du 10 KM de Yaoundé 2027">
    </div>
  </div>
</section>
<section class="band"><div class="wrap"><div class="shopband"><div><span class="eyebrow2">La collection officielle</span><h2>Portez les couleurs d'Odyssée</h2><p class="lead">T-shirts, polos, joggings, casquettes et sacs aux couleurs de L'Odyssée de l'environnement. Pour courir, encourager et soutenir la cause.</p></div><span class="btn y" style="cursor:default;opacity:.85">Bientôt disponible</span></div></div></section>
<section class="band sun">
  <div class="wrap">
    <h2>Entreprises : courez pour la cause</h2>
    <p class="lead">Inscrivez une équipe de 10 coureurs, devenez partenaire ou affectez votre soutien au Fonds de solidarité.</p>
    <div class="cta" style="margin:18px 0 0"><a class="btn g" href="#partenaires">Devenir partenaire</a></div>
  </div>
</section>
</div>

<!-- ============ NOTRE CAUSE ============ -->
<div class="view" id="cause">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Accueil</a> › Notre cause</div><h1>Notre cause</h1><p>Le Fonds de solidarité environnementale, raison d'être du 10 KM de Yaoundé : soutenir les personnes frappées par la destruction de l'environnement.</p></div></div>
<section class="band">
  <div class="wrap">
    <h2>Qui le Fonds soutient-il ?</h2>
    <p class="lead">Une partie des fonds collectés, issus des inscriptions payantes et des contributions des partenaires, alimente le <strong>Fonds de solidarité environnementale</strong>. Pour la première édition, son objectif est de <strong>5 000 000 FCFA</strong>, réunis grâce aux inscriptions, aux dons et aux contributions des partenaires.</p>
    <div class="gauge light"><div class="gtop"><span class="gnum">0 FCFA</span><span class="gof"></span></div><div class="bar"><i></i></div><p class="gnote"></p></div>
    <div class="cards" id="benefCards"></div>
  </div>
</section>
<section class="band soft">
  <div class="wrap two">
    <div>
      <h2>Comment le Fonds est géré</h2>
      <p class="lead">Chaque franc confié au Fonds doit arriver à ceux qui en ont besoin, de façon vérifiable.</p>
    </div>
    <ol class="steps">
      <li><div><b>Des critères publiés</b><span>Les conditions d'éligibilité sont rendues publiques avant toute attribution.</span></div></li>
      <li><div><b>Une identification concertée</b><span>Les situations sont identifiées avec des structures locales reconnues et en concertation avec les administrations compétentes.</span></div></li>
      <li><div><b>Un comité de sélection</b><span>Ses membres déclarent leurs conflits d'intérêts ; chaque décision est documentée.</span></div></li>
      <li><div><b>Un suivi distinct</b><span>Les sommes du Fonds sont suivies à part et la remise effective des aides est vérifiée.</span></div></li>
      <li><div><b>Un bilan public</b><span>Montants attribués et nombre de bénéficiaires publiés, sans exposer l'identité des personnes aidées.</span></div></li>
    </ol>
  </div>
</section>
<section class="band">
  <div class="wrap">
    <h2>Comment contribuer</h2>
    <div class="teasers">
      <a class="teaser" href="#inscriptions"><span class="k">Coureurs</span><h3>Courir</h3><p>Une partie de chaque inscription payante va au Fonds.</p><span class="go">S'inscrire →</span></a>
      <a class="teaser" href="#partenaires"><span class="k">Entreprises</span><h3>Soutenir</h3><p>Affectez tout ou partie de votre contribution au Fonds de solidarité.</p><span class="go">Devenir partenaire →</span></a>
      <a class="teaser" href="#benevoles"><span class="k">Bénévoles</span><h3>Donner du temps</h3><p>Rejoignez l'équipe qui fait vivre la course et le village.</p><span class="go">Devenir bénévole →</span></a>
    </div>
  </div>
</section>
</div>

<!-- ============ LA COURSE ============ -->
<div class="view" id="course">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Accueil</a> › La course</div><h1>La course</h1><p>Trois distances — 3 km de marche écologique et familiale, 5 km de course populaire et 10 km de défi sportif — solidaires et zéro déchet, le samedi 10 juillet 2027 (date provisoire).</p></div></div>
<section class="band">
  <div class="wrap two">
    <div>
      <h2>Une course pour toute la ville</h2>
      <p class="lead">Le 10 KM de Yaoundé pourra réunir jusqu'à 10 000 participants sur trois distances : le <strong>3 km</strong>, marche écologique et familiale accessible au plus grand nombre, le <strong>5 km</strong>, course populaire adaptée aux débutants et aux étudiants, et le <strong>10 km</strong>, défi sportif pour les coureurs plus entraînés. La date officielle sera annoncée après validation des parcours par les autorités.</p>
      <p>Elle est organisée par <strong>L'Odyssée de l'environnement au Cameroun</strong>, association déclarée à Yaoundé. Le réseau Odyssée a organisé le Green Hackathon Yaoundé 2026 et prépare sa deuxième édition pour juillet 2027.</p>
    </div>
    <div class="pillars">
      <div class="pillar"><b>1</b><div><h3>Solidarité</h3><p>La raison d'être de la course : soutenir les victimes de la destruction de l'environnement.</p></div></div>
      <div class="pillar"><b>2</b><div><h3>Environnement</h3><p>Une course zéro déchet, un parcours nettoyé et des déchets collectés, triés et comptés.</p></div></div>
      <div class="pillar"><b>3</b><div><h3>Sport</h3><p>Un rendez-vous annuel ouvert à tous : étudiants, travailleurs, familles, équipes d'entreprise.</p></div></div>
    </div>
  </div>
</section>
<section class="band soft">
  <div class="wrap">
    <h2>Chaque kilomètre compte pour l'environnement</h2>
    <p class="lead">7 500 000 FCFA sont consacrés au volet environnemental, trois fois plus qu'aux prix sportifs. Ses résultats seront mesurés et publiés après la course.</p>
    <div class="cards" id="envCards"></div>
  </div>
</section>
<section class="band" id="parcours">
  <div class="wrap two">
    <div>
      <h2>Le parcours <span class="prov">provisoire</span></h2>
      <p class="lead">Le 10 km part du boulevard du 20 Mai et arrive au Musée national, où se tient le village de l'Odyssée. Il passe par le rond-point Nlongkak, Elig-Essono et le carrefour Warda. Le 5 km part d'Elig-Essono et le 3 km de l'avenue Ahmadou-Ahidjo, sur la fin du même parcours. C'est une proposition : la distance sera mesurée officiellement et le tracé validé par les autorités municipales et les services de sécurité.</p>
      <ul class="list">
        <li>Points d'hydratation sans bouteilles jetables lorsque c'est possible</li>
        <li>Postes de secours répartis sur le parcours</li>
        <li>Un « kilomètre vert » de sensibilisation avec point de collecte</li>
        <li>Le 5 km et le 3 km empruntent la fin du parcours et arrivent aussi au Musée national</li>
        <li>Village de l'Odyssée à l'arrivée, au Musée national</li>
      </ul>
    </div>

<div class="view" id="presse">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Accueil</a> › Presse</div><h1>Presse et médias</h1><p>Communiqué, informations clés et contact presse du 10 KM de Yaoundé 2027.</p></div></div>
<section class="band">
  <div class="wrap two">
    <div>
      <h2>Communiqué de lancement</h2>
      <div class="card" id="cpFr" style="margin-top:18px">
        <p><strong>Yaoundé accueillera en 2027 la première édition du 10 KM de Yaoundé, une course solidaire au profit des victimes de la destruction de l'environnement</strong></p>
        <p>L'association L'Odyssée de l'environnement au Cameroun annonce la première édition du 10 KM de Yaoundé, une course à pied de 10 kilomètres prévue le samedi 10 juillet 2027 (date provisoire) dans la capitale.</p>
        <p>La course a une raison d'être : venir en aide aux veuves, aux enfants et orphelins, aux familles sinistrées et aux personnes malades frappés par la destruction de l'environnement. Une partie des fonds collectés alimente un Fonds de solidarité environnementale, dont l'objectif est de 5 000 000 FCFA pour la première édition. Ses bénéficiaires seront désignés selon des critères publics et son emploi fera l'objet d'un bilan public.</p>
        <p>Organisée selon des règles « zéro déchet », la course pourra réunir jusqu'à 10 000 participants sur trois distances : une marche écologique et familiale de 3 km, une course populaire de 5 km et un défi sportif de 10 km, du boulevard du 20 Mai au Musée national. L'inscription sera de 500 FCFA pour les étudiants, pour le 5 km et pour le 3 km, et de 1 000 FCFA pour les travailleurs sur le 10 km.</p>
        <p>La date officielle et le parcours seront annoncés après validation par les autorités compétentes. Informations : contact@odyssee-env.org.</p>
      </div>
      <button class="copy" data-copytarget="cpFr">Copier le communiqué</button>
    </div>

    <div>
      <h2>Avant de commencer</h2>
      <p class="lead">Ce plan s'adresse à celles et ceux qui peuvent déjà courir environ 30 minutes sans s'arrêter. Trois séances par semaine suffisent.</p>
      <ul class="list">
        <li><strong>Footing</strong> : une allure où vous pouvez parler sans être essoufflé.</li>
        <li><strong>Soutenu</strong> : une allure où vous ne pouvez dire que quelques mots.</li>
        <li><strong>Côtes</strong> : Yaoundé est la ville aux sept collines, profitez-en. Montée rapide, descente en marchant.</li>
        <li><strong>Sortie longue</strong> : toujours lente, c'est elle qui vous amène aux 10 km.</li>
      </ul>
      <p class="note">Consultez un médecin avant de commencer si vous n'avez pas fait de sport depuis longtemps ou si vous avez un doute sur votre santé. Courez tôt le matin ou en fin de journée, et buvez régulièrement.</p>

<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Accueil</a> › Mentions légales</div><h1>Mentions légales et confidentialité</h1><p>Qui édite ce site, et comment nous protégeons vos données personnelles.</p></div></div>
<section class="band legal">
  <div class="wrap" style="max-width:860px">
    <h2>Éditeur du site</h2>
    <p>L'Odyssée de l'environnement au Cameroun, association déclarée à Yaoundé. Récépissé de déclaration n° <span class="todo">à compléter</span>. Siège : <span class="todo">adresse à compléter</span>. Contact : contact@odyssee-env.org.</p>
    <p>Responsable de la publication : <span class="todo">nom du président de l'association</span>.</p>

    <p>Hébergeur : <span class="todo">à préciser lors de la mise en ligne</span>.</p>
    <h2>Propriété intellectuelle</h2>
    <p>Les textes, illustrations et le nom « 10 KM de Yaoundé » appartiennent à l'association. Toute reproduction demande son accord écrit. Les logos des partenaires restent la propriété de leurs titulaires.</p>
    <h2>Protection des données personnelles</h2>
    <p>Nous traitons les données personnelles dans le respect de la loi n° 2024/017 du 23 décembre 2024 relative à la protection des données à caractère personnel au Cameroun.</p>
    <h3>Ce site</h3>
    <p>Le site ne dépose aucun cookie publicitaire et n'utilise aucun outil de mesure d'audience. Il retient uniquement, dans votre navigateur, la langue que vous avez choisie.</p>
    <h3>Les inscriptions à la course</h3>
    <ul class="list">
      <li><strong>Données recueillies</strong> : nom, prénom, sexe, date de naissance, téléphone, ville, contact d'urgence et, pour les étudiants, l'établissement (facultatif).</li>
      <li><strong>Finalités</strong> : gérer votre inscription et votre paiement, attribuer votre dossard, assurer votre sécurité le jour de la course, publier les résultats.</li>
      <li><strong>Destinataires</strong> : l'équipe d'organisation, le prestataire de chronométrage, les secours pour le contact d'urgence, l'opérateur de paiement mobile.</li>
      <li><strong>Résultats</strong> : nom, catégorie et temps sont publiés dans les classements. Vous pouvez demander à apparaître sous vos seules initiales.</li>
      <li><strong>Durée de conservation</strong> : au plus 12 mois après la course, sauf les pièces comptables conservées selon la loi.</li>
      <li><strong>Géolocalisation</strong> : uniquement dans une version future de l'application, avec votre accord explicite et pendant la course seulement.</li>
    </ul>
    <h3>Le Fonds de solidarité</h3>
    <p>Les informations sur les bénéficiaires du Fonds sont strictement confidentielles, réservées au comité de sélection, et ne sont jamais publiées de façon nominative.</p>

    <p>Vous pouvez demander l'accès à vos données, leur rectification ou leur suppression en écrivant à contact@odyssee-env.org. Vous pouvez aussi saisir l'Autorité de protection des données à caractère personnel du Cameroun.</p>
    <p class="small" style="margin-top:18px">Dernière mise à jour : novembre 2026.</p>

    <div class="dist"><article class="dcard " style="--c:#14713b"><div class="top"><div class="km">3<small>km</small></div><div class="nm">Eco family walk</div></div><div class="body"><p>Open to as many people as possible: children, families, elders. Walk at your own pace.</p><div class="meta"><span>Open to all</span><span>Medal for everyone</span></div><div class="price">500 CFA <small>for everyone</small></div></div></article><article class="dcard y" style="--c:#f7c51e"><div class="top"><div class="km">5<small>km</small></div><div class="nm">Popular run</div></div><div class="body"><p>Suited to beginners and students, for a first race in the city.</p><div class="meta"><span>Open to all</span><span>Medal for everyone</span></div><div class="price">500 CFA <small>for everyone</small></div></div></article><article class="dcard " style="--c:#d62f2f"><div class="top"><div class="km">10<small>km</small></div><div class="nm">Sports challenge</div></div><div class="body"><p>For more trained runners, from the Boulevard du 20 Mai to the National Museum.</p><div class="meta"><span>Timed</span><span>2.5 M CFA in prizes</span></div><div class="price">500 / 1,000 CFA <small>students / workers</small></div></div></article></div>

<section class="band">
  <div class="wrap">
    <div class="cause">
      <div>
        <h2>Why we run</h2>
        <p class="lead" style="color:#d8eadf">The Yaoundé 10 KM exists to help widows, children and families struck by the destruction of the environment: floods, landslides, pollution.</p>
        <div class="cta" style="margin:18px 0 0"><a class="btn y" href="#cause">Discover the Solidarity Fund</a></div>
        <div class="gauge"><div class="gtop"><span class="gnum">0 FCFA</span><span class="gof"></span></div><div class="bar"><i></i></div><p class="gnote"></p></div>
      </div>
      <div class="big">5,000,000<small>CFA francs: Environmental Solidarity Fund target for the first edition</small></div>
    </div>
    <div class="teasers">
      <a class="teaser" href="#course"><span class="k">3 km · 5 km · 10 km · zero waste</span><h3>The race</h3><p>Three distances, the environmental programme and the route through the city of seven hills.</p><span class="go">Learn more →</span></a>
      <a class="teaser" href="#inscriptions"><span class="k">From 500 CFA</span><h3>Registration</h3><p>Fees, prizes and the official app to register and pay by mobile money.</p><span class="go">See fees →</span></a>
      <a class="teaser" href="#benevoles"><span class="k">Join the team</span><h3>Volunteers</h3><p>Welcome desk, water stations, waste collection: give your time to the cause.</p><span class="go">Volunteer →</span></a>
    </div>

        <p class="sig">Together, let's act for a sustainable future.</p>
        <p class="lead">The Yaoundé 10 KM is the first event hosted in Odyssée Connect, the app that brings together citizens, associations, companies and partners of the Odyssée network.</p>
        <ul class="feat"><li>Register for the 10 KM in minutes</li><li>Pay with Orange Money and MTN MoMo</li><li>Digital bib and QR code</li><li>Routes, info and notifications</li><li>Results and rankings</li><li>Coming soon: environmental actions and volunteering</li></ul>
        <a class="btn y" href="#application">Discover Odyssée Connect</a>

<div class="view" id="cause">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Home</a> › Our cause</div><h1>Our cause</h1><p>The Environmental Solidarity Fund, the reason the Yaoundé 10 KM exists: supporting people struck by the destruction of the environment.</p></div></div>
<section class="band">
  <div class="wrap">
    <h2>Who does the Fund support?</h2>
    <p class="lead">Part of the funds raised, from paid registrations and partner contributions, goes to the <strong>Environmental Solidarity Fund</strong>. For the first edition, its target is <strong>5,000,000 CFA francs</strong>, raised through registrations, donations and partner contributions.</p>
    <div class="gauge light"><div class="gtop"><span class="gnum">0 FCFA</span><span class="gof"></span></div><div class="bar"><i></i></div><p class="gnote"></p></div>
    <div class="cards" id="benefCards"></div>
  </div>
</section>
<section class="band soft">
  <div class="wrap two">
    <div>
      <h2>How the Fund is managed</h2>
      <p class="lead">Every franc entrusted to the Fund must reach those who need it, in a way that can be checked.</p>
    </div>
    <ol class="steps">
      <li><div><b>Published criteria</b><span>Eligibility conditions are made public before any award.</span></div></li>
      <li><div><b>Joint identification</b><span>Situations are identified with recognised local organisations and in consultation with the relevant authorities.</span></div></li>
      <li><div><b>A selection committee</b><span>Its members declare any conflict of interest; every decision is documented.</span></div></li>
      <li><div><b>Separate accounts</b><span>Fund money is tracked separately and actual delivery of aid is verified.</span></div></li>
      <li><div><b>A public report</b><span>Amounts awarded and number of beneficiaries are published, without revealing anyone's identity.</span></div></li>
    </ol>
  </div>
</section>
<section class="band">
  <div class="wrap">
    <h2>How to contribute</h2>
    <div class="teasers">
      <a class="teaser" href="#inscriptions"><span class="k">Runners</span><h3>Run</h3><p>Part of every paid registration goes to the Fund.</p><span class="go">Register →</span></a>
      <a class="teaser" href="#partenaires"><span class="k">Companies</span><h3>Support</h3><p>Allocate all or part of your contribution to the Solidarity Fund.</p><span class="go">Become a partner →</span></a>
      <a class="teaser" href="#benevoles"><span class="k">Volunteers</span><h3>Give your time</h3><p>Join the team that brings the race and the village to life.</p><span class="go">Volunteer →</span></a>
    </div>
  </div>
</section>

<div class="view" id="course">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Home</a> › The race</div><h1>The race</h1><p>Three distances — a 3 km eco family walk, a 5 km popular run and a 10 km sports challenge — for charity and zero waste, on Saturday 10 July 2027 (provisional date).</p></div></div>
<section class="band">
  <div class="wrap two">
    <div>
      <h2>A race for the whole city</h2>
      <p class="lead">The Yaoundé 10 KM can bring together up to 10,000 participants over three distances: the <strong>3 km</strong> eco family walk, open to as many people as possible, the <strong>5 km</strong> popular run, suited to beginners and students, and the <strong>10 km</strong> sports challenge for more trained runners. The official date will be announced once the authorities have approved the routes.</p>
      <p>It is organised by <strong>L'Odyssée de l'environnement au Cameroun</strong>, an association registered in Yaoundé. The Odyssée network organised the Green Hackathon Yaoundé 2026 and is preparing its second edition for July 2027.</p>
    </div>
    <div class="pillars">
      <div class="pillar"><b>1</b><div><h3>Solidarity</h3><p>The reason the race exists: supporting the victims of environmental destruction.</p></div></div>
      <div class="pillar"><b>2</b><div><h3>Environment</h3><p>A zero-waste race, a cleaned-up route, and waste collected, sorted and counted.</p></div></div>
      <div class="pillar"><b>3</b><div><h3>Sport</h3><p>A yearly event open to all: students, workers, families, company teams.</p></div></div>
    </div>
  </div>
</section>
<section class="band soft">
  <div class="wrap">
    <h2>Every kilometre counts for the environment</h2>
    <p class="lead">7,500,000 CFA francs go to the environmental programme, three times more than to sports prizes. Its results will be measured and published after the race.</p>
    <div class="cards" id="envCards"></div>
  </div>
</section>
<section class="band" id="parcours">
  <div class="wrap two">
    <div>
      <h2>The route <span class="prov">provisional</span></h2>
      <p class="lead">The 10 km starts on the Boulevard du 20 Mai and finishes at the National Museum, home of the Odyssée village. It runs through the Nlongkak roundabout, Elig-Essono and the Warda crossroads. The 5 km starts at Elig-Essono and the 3 km on Avenue Ahmadou-Ahidjo, on the last part of the same route. This is a proposal: the distance will be officially measured and the route approved by the city authorities and the security services.</p>
      <ul class="list">
        <li>Water stations without disposable bottles wherever possible</li>
        <li>First-aid posts along the route</li>
        <li>An awareness “green kilometre” with a collection point</li>
        <li>The 5 km and 3 km use the last part of the route and also finish at the National Museum</li>
        <li>Environmental village at the finish</li>
      </ul>
    </div>

<div class="view" id="inscriptions">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Home</a> › Registration</div><h1>Registration</h1><p>Registration opens on 1 December 2026, online and in the official app.</p></div></div>
<section class="band">
  <div class="wrap two">
    <div>
      <h2>Fees</h2>
      <table class="stack" style="margin-top:18px">
        <thead><tr><th>Race and who</th><th class="r">Fee</th><th>Details</th></tr></thead>
        <tbody>
          <tr><td><strong>10 km · Students</strong></td><td class="r"><span class="price">500 CFA</span></td><td>Sports challenge, timed, student prizes</td></tr>
          <tr><td><strong>10 km · Workers</strong></td><td class="r"><span class="price">1,000 CFA</span></td><td>Sports challenge, timed</td></tr>
          <tr><td><strong>5 km · Popular run</strong></td><td class="r"><span class="price">500 CFA</span></td><td>For everyone, suited to beginners and students</td></tr>
          <tr><td><strong>3 km · Eco family walk</strong></td><td class="r"><span class="price">500 CFA</span></td><td>For everyone, open to as many people as possible</td></tr>
          <tr><td><strong>Companies</strong></td><td class="r"><span class="price">100,000 CFA</span></td><td>Per team of 10 runners, on the distance of their choice, with a company challenge</td></tr>
        </tbody>
      </table>
      <p class="note">Payment by Orange Money or MTN MoMo. Part of every paid registration goes to the Solidarity Fund. Places open in stages: a first batch of 3,000, then more as registrations come in. Opening: 1 December 2026.</p>
    </div>
    <div>
      <h2 id="prix">Prizes</h2>
      <p class="lead">2,500,000 CFA francs in prizes on the 10 km, shared so that students are rewarded too. The 5 km and the 3 km walk have no ranking: every participant gets a medal.</p>
      <div class="scroll">
      <table>
        <thead><tr><th>Category</th><th class="r">1st</th><th class="r">2nd</th><th class="r">3rd</th><th class="r">4th–10th</th></tr></thead>
        <tbody id="prizeRows"></tbody>
      </table>
      </div>
      <p class="note">Amounts in CFA francs, subject to the official rules. A student card is required to receive a student prize.</p>
    </div>
  </div>
</section>
<section class="band soft">
  <div class="wrap two">
    <div><h2>Register with Odyssée Connect</h2><p class="lead">Registration, mobile-money payment and digital bib: everything happens in Odyssée Connect, the Odyssée network app.</p><div class="cta" style="margin-top:16px"><a class="btn y" href="#application">Discover Odyssée Connect</a></div></div>
    <img src="connect-ecrans.jpg" alt="Real app screens: home, registration, payment, bib, route, Solidarity Fund, actions and profile" loading="lazy" style="width:100%;border-radius:18px">
  </div>
</section>
</div>


<div class="view" id="application">
<div class="pagehead"><div class="wrap"><div class="crumb"><a href="#accueil">Home</a> › App</div><h1>Odyssée Connect</h1><p>Together, let's act for a sustainable future. The Odyssée network app, and your gateway to the Yaoundé 10 KM.</p></div></div>
<section class="band">
  <div class="wrap two">
    <div><h2>One app, a whole community</h2><p class="lead">Odyssée Connect brings together citizens, associations, companies and partners around the actions of the Odyssée network. It is not limited to one event: the Yaoundé 10 KM 2027 is the first event it hosts, and more services and projects will follow, in several countries.</p></div>
    <img src="connect-presentation.jpg" alt="Odyssée Connect: community home and the Yaoundé 10 KM 2027 page." style="width:100%;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.15)">
  </div>
</section>
<section class="band soft">
  <div class="wrap">
    <h2>For the Yaoundé 10 KM</h2>
    <div class="featgrid"><article class="feature"><span class="tagv ">Available at launch</span><h3>Register for the 10 KM</h3><p>With your phone number and a code received by text message. Choose your distance: 3, 5 or 10 km.</p></article><article class="feature"><span class="tagv ">Available at launch</span><h3>Pay by mobile money</h3><p>Orange Money or MTN MoMo, securely. Registration confirmed as soon as payment is validated.</p></article><article class="feature"><span class="tagv ">Available at launch</span><h3>Get your digital bib</h3><p>A number and a QR code to show at bib collection.</p></article><article class="feature"><span class="tagv ">Available at launch</span><h3>Routes and information</h3><p>Routes of the three distances, rules, times, health and zero-waste advice, notifications.</p></article><article class="feature"><span class="tagv ">Race day</span><h3>Check your results</h3><p>Your time and the rankings by distance and category, as soon as they are validated.</p></article><article class="feature"><span class="tagv soon">Coming soon</span><h3>Follow the race live</h3><p>Runners' positions on the map, water and first-aid points, with your consent.</p></article></div>
  </div>
</section>
<section class="band">
  <div class="wrap">
    <h2>App preview</h2>
    <figure class="shot1"><img src="connect-ecrans.jpg" alt="The runner journey: registration, choice of distance, payment, bib, route, Solidarity Fund, actions and profile." loading="lazy"><figcaption>The runner journey: registration, choice of distance, payment, bib, route, ranking and profile.</figcaption></figure>
    <p class="note" style="margin-top:20px">Odyssée Connect will first be a web app you can install on Android and iPhone, available when registration for the 10 KM opens. The screens shown are mock-ups; names, times and amounts are fictitious.</p>
  </div>
</section>
<section class="band soft">
  <div class="wrap">
    <h2>And tomorrow, beyond the race</h2>
    <div class="featgrid"><article class="feature"><span class="tagv soon">Coming</span><h3>Sports events</h3><p>The 10 KM, other races and challenges, in several cities.</p></article><article class="feature"><span class="tagv soon">Coming</span><h3>Environmental actions</h3><p>Clean-ups, recycling, tree planting: find an action near you and take part.</p></article><article class="feature"><span class="tagv soon">Coming</span><h3>Community and volunteering</h3><p>Become an Odyssée ambassador and join the volunteer teams.</p></article><article class="feature"><span class="tagv soon">Coming</span><h3>News and projects</h3><p>News from the network and the projects it supports.</p></article><article class="feature"><span class="tagv soon">Coming</span><h3>Impact tracking</h3><p>The environmental and social results of actions, published and verifiable.</p></article></div>
    <div class="cta" style="margin-top:22px"><a class="btn y" href="#inscriptions">See 10 KM fees</a></div>
  </div>

      <h2>Launch press release</h2>
      <div class="card" id="cpEn" style="margin-top:18px">
        <p><strong>Yaoundé to host the first Yaoundé 10 KM in 2027, a charity race for the victims of environmental destruction</strong></p>
        <p>The association L'Odyssée de l'environnement au Cameroun announces the first edition of the Yaoundé 10 KM, a 10-kilometre road race planned in the capital on Saturday 10 July 2027 (provisional date).</p>
        <p>The race exists for one reason: to help widows, children and orphans, disaster-hit families and people made ill by the destruction of the environment. Part of the funds raised goes to an Environmental Solidarity Fund, with a target of 5,000,000 CFA francs for the first edition. Beneficiaries will be chosen according to public criteria and the use of the Fund will be publicly reported.</p>
        <p>Run under zero-waste rules, the race can bring together up to 10,000 participants over three distances: a 3 km eco family walk, a 5 km popular run and a 10 km sports challenge, from the Boulevard du 20 Mai to the National Museum. Registration will cost 500 CFA francs for students and for the 5 km and 3 km, and 1,000 CFA francs for workers on the 10 km.</p>
        <p>The official date and route will be announced once approved by the relevant authorities. Information: contact@odyssee-env.org.</p>

      <h2>Before you start</h2>
      <p class="lead">This plan is for anyone who can already run about 30 minutes without stopping. Three sessions a week are enough.</p>
      <ul class="list">
        <li><strong>Easy run</strong>: a pace at which you can talk without getting out of breath.</li>
        <li><strong>Steady</strong>: a pace at which you can only say a few words.</li>
        <li><strong>Hills</strong>: Yaoundé is the city of seven hills, make the most of it. Run up fast, walk down.</li>
        <li><strong>Long run</strong>: always slow, it is what carries you to 10 km.</li>
      </ul>
      <p class="note">See a doctor before you start if you have not exercised for a long time or have any doubt about your health. Run early in the morning or late in the day, and drink regularly.</p>

    ['What is the Fund for?','It supports widows, children and orphans, disaster-hit families and people made ill by the destruction of the environment. It is the reason the race exists.'],
    ['How are beneficiaries chosen?','According to published criteria, with recognised local organisations and in consultation with the authorities. A selection committee documents every decision.'],
    ['How will I know how the money was used?','A public report will present the amounts raised and awarded and the number of beneficiaries, without revealing anyone\'s identity.']
  ]]
 ],
 ui: {gaugeOf:'raised of {o} CFA · {p}%', gaugeSoon:'Fundraising starts when registration opens.', gaugeUpd:'Updated on {d}.', challenge:'Company challenge', trophy:'Trophy', locale:'en-GB', copy:'Copy address', copied:'Address copied', copyFail:'Copy failed: select the text', copiedText:'Text copied', title:'Yaoundé 10 KM 2027'}
};

const root = document.getElementById('root');
let D = FR, views = [];
function show() {
  const h = (location.hash || '#accueil').slice(1);
  const el = h ? document.getElementById(h) : null;
  const host = el ? el.closest('.view') : null;
  const target = views.includes(h) ? h : (host ? host.id : 'accueil');
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === target));
  document.querySelectorAll('.links a').forEach(a => a.getAttribute('href') === '#' + target ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const t = document.querySelector('#' + target + ' h1');
  document.title = (target === 'accueil' || !t ? '' : t.textContent + ' · ') + D.ui.title;
  const menu = document.getElementById('menu'), burger = document.getElementById('burger');
  menu.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
  if (el && !views.includes(h)) el.scrollIntoView(); else window.scrollTo(0, 0);
}
function mount(lang) {
  D = lang === 'en' ? EN : FR;
  root.replaceChildren(document.getElementById('tpl-' + lang).content.cloneNode(true));
  document.documentElement.lang = lang;
  const fmt = n => n ? n.toLocaleString(D.ui.locale) : '—';
  document.getElementById('envCards').innerHTML = D.env.map(card).join('');
  document.getElementById('benefCards').innerHTML = D.benef.map(card).join('');
  document.getElementById('infoCards').innerHTML = D.infoRunners.map(card).join('');
  document.getElementById('volCards').innerHTML = D.volunteers.map(card).join('');
  document.getElementById('prizeRows').innerHTML = D.prizes.map(([c,a,b,d,e]) =>
    `<tr><td><strong>${c}</strong></td><td class="r">${fmt(a)}</td><td class="r">${fmt(b)}</td><td class="r">${fmt(d)}</td><td class="r">${fmt(e)}</td></tr>`).join('')
    + `<tr><td><strong>${D.ui.challenge}</strong></td><td class="r">${D.ui.trophy}</td><td class="r">—</td><td class="r">—</td><td class="r">—</td></tr>`;
  document.getElementById('levels').innerHTML = D.levels.map(([n,a,d,c]) => `<div class="lvl" style="--c:${c}"><span>${n}</span><b>${a}</b><span>${d}</span></div>`).join('');
  document.getElementById('faqList').innerHTML = D.faq.map(([cat,qs]) => `<div class="faqcat">${cat}</div>` + qs.map(([q,a]) => `<details><summary>${q}</summary><div>${a}</div></details>`).join('')).join('');

  // plan d'entraînement
  const pr = document.getElementById('planRows');
  if (pr) pr.innerHTML = PLAN[lang].map(([w,a,b,c]) => `<tr${w==='12'?' class="race"':''}><td><strong>${w}</strong></td><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join('');
  // jauge du Fonds
  document.querySelectorAll('.gauge').forEach(g => {
    const pct = Math.min(100, Math.round(FONDS.collecte / FONDS.objectif * 100));
    g.querySelector('.bar i').style.width = pct + '%';
    g.querySelector('.gnum').textContent = FONDS.collecte.toLocaleString(D.ui.locale) + ' FCFA';
    g.querySelector('.gof').textContent = D.ui.gaugeOf.replace('{o}', FONDS.objectif.toLocaleString(D.ui.locale)).replace('{p}', pct);
    g.querySelector('.gnote').textContent = FONDS.collecte === 0 ? D.ui.gaugeSoon : (FONDS.maj ? D.ui.gaugeUpd.replace('{d}', FONDS.maj) : '');
  });
  // réseaux sociaux
  const names = { facebook: 'Facebook', linkedin: 'LinkedIn', instagram: 'Instagram' };
  document.querySelectorAll('.social').forEach(box => {
    const links = Object.entries(SOCIAL).filter(([, u]) => u.startsWith('https://'));
    box.hidden = links.length === 0;
    box.querySelector('.slinks').replaceChildren(...links.map(([k, u]) => { const a = document.createElement('a'); a.href = u; a.textContent = names[k]; a.rel = 'noopener'; return a; }));
  });
  views = [...document.querySelectorAll('.view')].map(v => v.id);
  const menu = document.getElementById('menu'), burger = document.getElementById('burger');
  burger.addEventListener('click', () => { const o = menu.classList.toggle('open'); burger.setAttribute('aria-expanded', String(o)); });
  document.querySelectorAll('.lang').forEach(b => b.addEventListener('click', () => {
    try { localStorage.setItem('lang20km', b.dataset.lang); } catch (e) {}
    mount(b.dataset.lang);
  }));
  document.querySelectorAll('[data-copytarget]').forEach(b => { const label = b.textContent; b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(document.getElementById(b.dataset.copytarget).innerText); b.textContent = D.ui.copiedText; }
    catch (e) { b.textContent = D.ui.copyFail; }
    setTimeout(() => { b.textContent = label; }, 2500);
  }); });
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = D.ui.copied; }
    catch (e) { b.textContent = D.ui.copyFail; }
    setTimeout(() => { b.textContent = D.ui.copy; }, 2500);
  }));
  show();
}
window.addEventListener('hashchange', show);
let start = 'fr';
try { if (localStorage.getItem('lang20km') === 'en') start = 'en'; } catch (e) {}
mount(start);

}
</script>
<script>
(function(){
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    document.querySelectorAll('[data-cd]').forEach(function(el){
      var r=Math.max(0,Math.floor((new Date(el.getAttribute('data-cd'))-Date.now())/1000));
      var v={j:Math.floor(r/86400),h:pad(Math.floor(r%86400/3600)),m:pad(Math.floor(r%3600/60)),s:pad(r%60)};
      el.querySelectorAll('[data-u]').forEach(function(b){b.textContent=v[b.getAttribute('data-u')];});
    });
  }
  tick(); setInterval(tick,1000);
})();

<script src="parcours.js"></script>
<script>
/* Parcours interactif (mêmes tracés que l'appli Odyssée Connect) */
(function () {
  const T = window.ODC_TRACES || {};
  let dl = null;
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then((d) => { dl = d; }).catch(() => {}); } catch (e) { /* hors claude.ai */ }
  const L = {
    fr: { dist: 'Distance calculée', dep: 'Départ', arr: 'Arrivée', ravit: 'Ravitaillement', gpx: 'Télécharger le tracé (GPX) pour votre montre ou Strava',
          note: 'Proposition non mesurée : la distance officielle sera fixée par un mesureur agréé et le tracé validé par les autorités de Yaoundé.',
          sansR: 'Pas de ravitaillement sur le parcours : eau au départ et au village d’arrivée.', avecR: (k) => 'Ravitaillement prévu au km ' + k.join(', ') + ' (emplacement indicatif).' },
    en: { dist: 'Calculated distance', dep: 'Start', arr: 'Finish', ravit: 'Water station', gpx: 'Download the route (GPX) for your watch or Strava',
          note: 'Unmeasured proposal: the official distance will be set by an accredited measurer and the route approved by the Yaoundé authorities.',
          sansR: 'No water station on the route: water at the start and at the finish village.', avecR: (k) => 'Water station planned at km ' + k.join(', ') + ' (indicative location).' }
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function projeter(coords, W, H, m) {
    const la = coords.map((p) => p[0]), lo = coords.map((p) => p[1]);
    const c = Math.cos((Math.min(...la) + Math.max(...la)) / 2 * Math.PI / 180);
    const x0 = Math.min(...lo) * c, x1 = Math.max(...lo) * c, y0 = Math.min(...la), y1 = Math.max(...la);
    const k = Math.min((W - 2 * m) / (x1 - x0 || 1), (H - 2 * m) / (y1 - y0 || 1));
    const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
    return (p) => [ox + (p[1] * c - x0) * k, H - (oy + (p[0] - y0) * k)];
  }
  function plan(t, l) {
    const W = 520, H = 400, xy = projeter(t.coords, W, H, 30);
    const d = t.coords.map((p, i) => { const [x, y] = xy(p); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }).join(' ');
    const [dx, dy] = xy(t.coords[0]), [ax, ay] = xy(t.coords[t.coords.length - 1]);
    const bornes = Object.entries(t.km || {}).map(([k, p]) => { const [x, y] = xy(p); const r = (t.ravitaillements || []).includes(+k);
      return r ? `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="11" fill="#1d5f99" stroke="#fff" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${k}</text></g>`
               : `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="9" fill="#f7c51e" stroke="#fff" stroke-width="1.5"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="#13261a">${k}</text></g>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.nom)}"><rect width="${W}" height="${H}" rx="12" fill="var(--soft,#eef3ea)"/>
      <path d="${d}" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="#f7c51e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="#0b4d2c" stroke-width="1.6" stroke-dasharray="6 6"/>${bornes}
      <g transform="translate(${dx.toFixed(1)} ${dy.toFixed(1)})"><circle r="14" fill="#0b4d2c" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">D</text></g>
      <g transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)})"><circle r="14" fill="#c62828" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">A</text></g>
      <text x="12" y="${H - 12}" font-size="10" fill="#5b6b5f">© OpenStreetMap contributors · OSRM</text>
      <g transform="translate(${W - 30} 32)"><path d="M0 -14 L6 4 L0 0 L-6 4Z" fill="#0b4d2c"/><text y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#0b4d2c">N</text></g></svg>`;
  }
  function rendre(fig, id) {
    const lang = fig.dataset.traceLang === 'en' ? 'en' : 'fr', l = L[lang], t = T[id]; if (!t) return;
    const km = (n) => n.toLocaleString(lang === 'en' ? 'en-GB' : 'fr-FR', { maximumFractionDigits: 1 }) + ' km';
    const r = t.ravitaillements || [];
    fig.innerHTML = `<div class="tr-tabs" role="group" aria-label="Distance">${['3', '5', '10'].filter((k) => T[k]).map((k) => `<button type="button" class="t${k}" data-tr="${k}" aria-pressed="${k === id}">${k} KM</button>`).join('')}</div>
      ${plan(t, l)}
      <div class="tr-leg"><span><i style="background:#0b4d2c"></i>${l.dep} · ${esc(t.depart)}</span><span><i style="background:#c62828"></i>${l.arr} · ${esc(t.arrivee)}</span>${r.length ? `<span><i style="background:#1d5f99"></i>${l.ravit}</span>` : ''}</div>
      <p class="tr-info"><b>${l.dist} : ${km(t.longueur_m / 1000)}.</b> ${l.note}</p>
      <ol class="tr-etapes">${(t.etapes || []).map((e, i, a) => `<li class="${i === 0 ? 'dep' : i === a.length - 1 ? 'arr' : ''}"><span class="km">${km(e.km)}</span><span><b>${esc(e.nom)}</b><small>${esc(e.par)}</small></span></li>`).join('')}</ol>
      <p class="tr-info">${r.length ? l.avecR(r) : l.sansR}</p>
      <a class="tr-dl" href="#" data-gpx="${id}">⬇ ${l.gpx}</a>`;
  }
  const tout = () => document.querySelectorAll('figure[data-trace-lang]').forEach((f) => { if (!f.querySelector('.tr-tabs')) rendre(f, '10'); });
  tout();
  // La page change de langue en remplaçant son contenu : on redessine les parcours qui apparaissent
  new MutationObserver(tout).observe(document.body, { childList: true, subtree: true });
  // Fichier GPX fabriqué dans le navigateur à partir du même tracé
  function gpx(t) {
    const pts = t.coords.map((p) => `<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="L'Odyssée de l'environnement" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${esc(t.nom)}</name><copyright author="OpenStreetMap contributors"><license>https://opendatacommons.org/licenses/odbl/</license></copyright></metadata><trk><name>${esc(t.nom)}</name><trkseg>${pts}</trkseg></trk></gpx>`;
  }
  document.addEventListener('click', (e) => {
    const g = e.target.closest('[data-gpx]');
    if (g) { e.preventDefault(); const t = T[g.dataset.gpx]; if (!t) return;
      const blob = new Blob([gpx(t)], { type: 'application/gpx+xml' }), filename = 'parcours-' + t.id + 'km-yaounde-2027.gpx';
      if (dl) { dl.save({ filename, data: blob }).catch(() => {}); return; }
      // Page ouverte hors de claude.ai : lien de téléchargement classique
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return; }
    const b = e.target.closest('[data-tr]'); if (!b) return;
    rendre(b.closest('figure[data-trace-lang]'), b.dataset.tr);
  });
})();
</script>
