name: Vérifications

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  javascript:
    name: Syntaxe JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in js/*.js sw.js; do node --check "$f"; done

  base-de-donnees:
    name: Migrations de la base
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      ODC_BASE_DE_TEST: oui   # base jetable du runner : le test de concurrence peut la modifier
    steps:
      - uses: actions/checkout@v4
      - run: tests/verifier_sql.sh

  ecrans:
    name: Écrans en mode démonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 &
          sleep 2
          python tests/verifier_demo.py
