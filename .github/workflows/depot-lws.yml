# Envoie l'application sur LWS : https://inscription.odyssee-env.org/
# Le mot de passe FTP est dans le secret LWS_FTP_PASSWORD (jamais dans le code).
name: Dépôt sur LWS

on:
  push:
    branches: [deploiement/lws]
  workflow_dispatch:

concurrency:
  group: depot-lws
  cancel-in-progress: false

jobs:
  depot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        run: |
          mkdir -p site
          cp -r index.html manifest.webmanifest sw.js css js images icons site/
          [ -d parcours ] && cp -r parcours site/ || true
          [ -d outils ] && cp -r outils site/ || true
          cp deploiement/lws.htaccess site/.htaccess
          find site -type f | sort

      - name: Envoyer sur LWS (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.odyssee-env.org
          username: odyss2839868
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: inscription.odyssee-env.org/
