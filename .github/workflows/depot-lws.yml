# Envoie l'application sur LWS : https://inscription.odyssee-env.com/
# Le mot de passe FTP est dans le secret LWS_FTP_PASSWORD_COM (jamais dans le code).
# Chaque fusion dans develop met à jour le site de test (version de démonstration tant que js/config.js est vide).
name: Dépôt sur LWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: depot-lws
  cancel-in-progress: false

jobs:
  depot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        run: |
          mkdir -p site
          cp -r index.html manifest.webmanifest sw.js css js images icons site/
          [ -d parcours ] && cp -r parcours site/ || true
          mkdir -p site/outils && cp outils/*.html site/outils/
          cp deploiement/lws.htaccess site/.htaccess
          find site -type f | sort

      - name: Envoyer sur LWS (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 193.203.239.78
          username: odyss2839870
          password: ${{ secrets.LWS_FTP_PASSWORD_COM }}
          protocol: ftps
          local-dir: ./site/
          server-dir: inscription.odyssee-env.com/
          timeout: 120000
